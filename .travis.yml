language: python

os:
  - linux
  - osx

dist: trusty
sudo: enabled

python:
  - "2.7"

before_install:
  - if [[ "$TRAVIS_OS_NAME" == "linux" ]]; then sudo apt-get -qq update ; fi
  - if [[ "$TRAVIS_OS_NAME" == "linux" ]]; then sudo apt-get install -y yaz ; fi
  - if [[ "$TRAVIS_OS_NAME" == "os x" ]]; then sudo brew install yaz ; fi
  - yaz-marcdump -V

install: pip install -r requirements.txt

before_script: export PYTHONPATH=$PYTHONPATH:$(pwd)
script: pytest
